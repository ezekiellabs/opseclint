---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      # A workspace build enables opseclint-core's `clap` feature, because the
      # binary asks for it. Building core alone is the only configuration that
      # proves the library still stands without the CLI's dependencies — a
      # stray `use clap::…` in core passes the step above and fails here.
      - name: Test opseclint-core standalone
        run: cargo test -p opseclint-core --verbose

      # opseclint-core is `#![warn(missing_docs)]`, which this promotes to an
      # error. A knowledge-base crate whose fields are undocumented invites the
      # consumer to guess what `noise` or `Indeterminate` means, and a guess
      # here produces a plausible wrong answer rather than a compile error.
      # Also catches broken intra-doc links before they reach docs.rs.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  packaging:
    name: packaging version parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Offline string comparison, so this is safe to require. It catches a
      # Cargo.toml bump that forgets packaging/; the artifact hashes are
      # verified separately after a release publishes, in release.yml.
      - name: Check packaging/ against Cargo.toml
        run: scripts/sync-packaging.sh --check

  sigma-pin:
    name: sigma pin consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Offline too, for the same reason as the job above: it catches a
      # baseline regenerated against some ruleset other than the pinned one,
      # which would otherwise make the regression gate below compare two
      # things that were never computed from the same rules.
      - name: Check .ci/sigma-ref against the baselines
        run: scripts/sync-sigma.sh --check

  scan:
    name: code scanning upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Run opseclint (SARIF)
        run: ./target/release/opseclint examples/recon.sh --sarif > opseclint.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opseclint.sarif
          category: opseclint

  sigma-enrich:
    # "live" here means a real SigmaHQ checkout rather than the hand-written
    # fixtures the unit tests use — not a floating one. The revision is pinned,
    # same as the gate below.
    name: sigma live enrichment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read the pinned SigmaHQ revision
        id: sigma
        run: echo "ref=$(scripts/sync-sigma.sh --ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned SigmaHQ ruleset
        uses: actions/checkout@v7
        with:
          repository: SigmaHQ/sigma
          ref: ${{ steps.sigma.outputs.ref }}
          path: sigma-rules
          fetch-depth: 1
          persist-credentials: false

      - name: Build release binary
        run: cargo build --release

      - name: Enrich examples with real SigmaHQ rules
        run: |
          set -o pipefail
          out=$(./target/release/opseclint examples/recon.sh --sigma sigma-rules/rules --no-color 2>&1)
          echo "$out"
          n=$(printf '%s\n' "$out" | grep -oE 'enriched [0-9]+ finding' | grep -oE '[0-9]+' | head -1)
          n=${n:-0}
          echo "findings enriched with real Sigma rules: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::no findings were enriched from the live SigmaHQ ruleset"
            exit 1
          fi

  verify-detections:
    name: verify detections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read the pinned SigmaHQ revision
        id: sigma
        run: echo "ref=$(scripts/sync-sigma.sh --ref)" >> "$GITHUB_OUTPUT"

      # Pinned, not floating: this job compares the committed baselines against
      # the ruleset on disk, so if the ruleset moved on its own the comparison
      # would not be reproducible and an unrelated pull request could go red
      # because SigmaHQ merged a rule overnight. sigma-drift.yml watches
      # upstream on a schedule instead.
      - name: Check out the pinned SigmaHQ ruleset
        uses: actions/checkout@v7
        with:
          repository: SigmaHQ/sigma
          ref: ${{ steps.sigma.outputs.ref }}
          path: sigma-rules
          fetch-depth: 1
          persist-credentials: false

      - name: Build release binary
        run: cargo build --release

      - name: Verify KB detection claims against SigmaHQ (regression gate)
        # Bound through the environment rather than interpolated into the shell
        # body: ${{ }} is substituted before bash ever sees the script.
        env:
          SIGMA_REF: ${{ steps.sigma.outputs.ref }}
        run: |
          # For each platform, prove the knowledge base's Sigma detection claims
          # against the pinned ruleset and fail if any previously-verified
          # detection regressed vs the committed baseline
          # (.ci/verified-<platform>.json). When SigmaHQ upstream legitimately
          # shifts a verdict, move the pin and the baselines together:
          #   scripts/sync-sigma.sh --bump <sha|latest>
          fail=0
          for plat in linux windows macos; do
            echo "== $plat =="
            ./target/release/opseclint --verify-detections \
              --sigma sigma-rules/rules --platform "$plat" \
              --sigma-ref "$SIGMA_REF" \
              --diff ".ci/verified-$plat.json" --ci --no-color || fail=1
          done
          exit $fail
