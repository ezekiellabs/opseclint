name: Publish to crates.io

on:
  push:
    tags:
      # Full versions only. The moving major tag (`v1`) is a pointer, not a
      # release — matching it here would try to re-publish a version already on
      # crates.io every time the pointer moves.
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # --workspace publishes opseclint-core before opseclint and verifies the
      # binary against the core it just packaged, so the two never drift apart
      # on crates.io. Publishing them one at a time would leave a window where
      # `cargo install opseclint` resolves against a core that is not there yet.
      - name: Verify the packages build
        run: cargo publish --workspace --dry-run --locked

      - name: Publish
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
