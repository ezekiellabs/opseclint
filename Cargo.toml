[workspace]
members = ["crates/opseclint-core", "crates/opseclint", "crates/opseclint-mcp"]
resolver = "3"

# Both crates release together and share one version: `opseclint` depends on the
# exact `opseclint-core` it was built against, so a core change that moves the
# analysis behaviour cannot reach users under an unchanged binary version.
# scripts/sync-packaging.sh reads the version from here.
[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ezekiellabs/opseclint"
homepage = "https://github.com/ezekiellabs/opseclint"

[workspace.dependencies]
opseclint-core = { version = "1.4.0", path = "crates/opseclint-core" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
