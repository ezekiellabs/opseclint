---
title: Certutil Spawned By An Office Application
id: 44444444-4444-4444-4444-444444444444
status: test
description: >
  certutil launched as a child of a Microsoft Office application — a common
  download-cradle pattern. Keys on ParentImage, a field a command line alone
  cannot supply, so it is indeterminate in predictive mode but resolves against
  a real recorded event.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\certutil.exe'
    ParentImage|endswith: '\WINWORD.EXE'
  condition: selection
level: high
tags:
  - attack.command_and_control
  - attack.t1105
