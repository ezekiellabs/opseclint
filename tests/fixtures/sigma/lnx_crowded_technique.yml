---
# Six rules for one technique, all the same level, so `rules_for`'s
# severity-then-title ranking degenerates to alphabetical. Five decoys sort
# ahead of the only rule that actually fires, which is exactly how a display
# cap of five turned a real detection into a contradicted claim. Verification
# and coverage must reach the sixth.
title: Aardvark Decoy Rule
id: 51111111-0000-4000-8000-000000000001
status: test
description: Decoy — keys on a string the crowded-technique command never contains.
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains: "decoy-aardvark"
  condition: selection
level: high
tags:
  - attack.impact
  - attack.t1490
