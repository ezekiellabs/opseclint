title: Zebra Snapshot Deletion
id: 51111111-0000-4000-8000-000000000006
status: test
description: >
  The one rule of the six that fires. Same level as the decoys, so it is
  ordered last on title alone — past a cap of five.
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - "lvremove"
      - "--force"
  condition: selection
level: high
tags:
  - attack.impact
  - attack.t1490
